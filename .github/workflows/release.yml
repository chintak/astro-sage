name: Release

# On every push to main, changesets/action either opens/updates the
# "Version Packages" PR (when changesets are pending) or, once that PR is
# merged, publishes astro-sage to npm and pushes the astro-sage@x.y.z tag.
# Publishing uses npm trusted publishing (OIDC): no NPM_TOKEN secret.

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # version commits, tags, GitHub releases
  pull-requests: write # the Version Packages PR
  id-token: write # npm trusted publishing + provenance

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing needs npm >= 11.5.1 (pnpm publishes through npm).
      - run: npm install -g npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: Release astro-sage
          commit: Release astro-sage
          commitMode: github-api # signed commits, as main's ruleset requires
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
